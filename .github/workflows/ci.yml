name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enjua
          POSTGRES_PASSWORD: enjua
          POSTGRES_DB: enjua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enjua -d enjua_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://enjua:enjua@localhost:5432/enjua_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Migrations are in sync with the schema
        run: |
          npx drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema changed without a committed migration. Run npm run db:generate."
            git status --porcelain drizzle
            exit 1
          fi
      - name: Migrations are production-safe (no unreviewed destructive SQL)
        run: npm run db:check-migrations
      - name: Unit tests
        run: npm run test:unit
      - name: Start S3-compatible test server (moto) for the storage driver tests
        run: |
          python3 -m venv /tmp/moto && /tmp/moto/bin/pip install -q "moto[server]==5.1.4"
          /tmp/moto/bin/moto_server -p 9010 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9010/ > /dev/null && break; sleep 1; done
      - name: Integration tests (PostgreSQL + S3-compatible storage)
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9010
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright + axe, responsive matrix)
        env:
          # Reuses the disposable test database; global setup wipes and re-seeds it.
          E2E_DATABASE_URL: postgres://enjua:enjua@localhost:5432/enjua_test
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
